name: Checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Compile all entry points and run protocol tests
        run: cargo test --locked --release --all-targets
      - name: Reproduce deterministic estimates
        run: python3 scripts/reproduce.py estimates --output results/reproduce/ci-estimates
      - name: Check instrumented verifier accounting
        run: cargo test --locked --release --lib --features fs-accounting
      - name: Check reproduction and reference data
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/validate_results.py
