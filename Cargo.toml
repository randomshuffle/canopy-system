[package]
name = "canopy-system"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Proof-size and timing comparison for Merkle and Canopy vector commitments"

[dependencies]
anyhow = "1.0"
ark-ff = { version = "0.5", features = ["asm", "parallel", "std"] }
ark-poly = { version = "0.5", features = ["parallel", "std"] }
ark-serialize = "0.5"
ark-std = { version = "0.5", features = ["std"] }
blake3 = { version = "=1.5.5", features = ["rayon", "traits-preview"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
spongefish = { git = "https://github.com/arkworks-rs/spongefish", rev = "fcc277f8a857fdeeadd7cca92ab08de63b1ff1a1", features = ["ark-ff"] }
tracing = { version = "0.1", optional = true }
whir-ref = { package = "whir", path = "vendor/whir" }

[features]
whir-tracing = ["dep:tracing", "whir-ref/tracing"]

[dev-dependencies]
tempfile = "3.12"

[profile.release]
lto = "thin"
codegen-units = 1
