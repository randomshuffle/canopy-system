[package]
name = "canopy-binary-whir"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
ark-ff = { version = "0.5", features = ["asm", "parallel", "std"] }
ark-serialize = "0.5"
ark-std = { version = "0.5", features = ["std"] }
blake3 = { version = "=1.5.5", features = ["rayon", "traits-preview"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
zeroize = "1"
spongefish = { git = "https://github.com/arkworks-rs/spongefish", rev = "fcc277f8a857fdeeadd7cca92ab08de63b1ff1a1", features = ["ark-ff"] }
whir-ref = { package = "whir", path = "../../../vendor/whir" }

[dev-dependencies]
tempfile = "3.12"

[features]
fs-accounting = []

[profile.release]
lto = "thin"
codegen-units = 1
